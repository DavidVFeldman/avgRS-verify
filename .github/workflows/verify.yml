name: verify

# Builds the project from clean and records the axiom audit in the log.
# Manual runs: Actions -> verify -> Run workflow.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          echo "cores: $(nproc)"; free -g; df -h /; ulimit -s

      - name: Closure audit (no sorry, admit, native_decide, unsafe)
        run: |
          python3 scripts/audit_sorries.py \
            RequestProject.ZLineProof \
            RequestProject.AverageTableau \
            RequestProject.DiagonalArrivalAllN

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: lean --version && lake --version

      - name: Mathlib cache
        run: lake exe cache get

      - name: Build (both library targets)
        run: |
          ulimit -s unlimited || true
          lake build 2>&1 | tee build.log
          echo "--- exit status of lake build: ${PIPESTATUS[0]}"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Warnings and errors in the build log
        if: always()
        run: |
          grep -nE "^(error|warning)" build.log | head -50 || echo "none"

      - name: Axiom audit
        run: |
          lake env lean Audit.lean 2>&1 | tee axioms.log
          echo "--- every line below should name only propext, Classical.choice, Quot.sound"
          cat axioms.log
          ! grep -qi "sorryAx\|ofReduceBool\|trustCompiler" axioms.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            build.log
            axioms.log
